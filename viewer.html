<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Scores | Score-X</title><style>
:root{color-scheme:dark;--bg:#071b16;--panel:#102a23;--line:#29473d;--lime:#c6f36b;--muted:#a6bbb1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f8f4;font:16px system-ui,Arial}header,main{max-width:900px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}a{color:var(--lime);text-decoration:none}.brand{font-size:22px;font-weight:900}.muted{color:var(--muted)}.match{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.tag{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:1px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:22px 0}.team:last-child{text-align:right}.score{font-size:clamp(27px,5vw,42px);font-weight:900;letter-spacing:-1px}.overs{color:var(--muted);font-size:14px}.vs{color:var(--muted)}.status{border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}.players{margin:12px 0;padding:12px;border-radius:10px;background:#0a211a;color:#d7e8dc;font-size:14px}.players b{color:#c6f36b}.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}.refresh{font-size:12px;color:var(--muted)}</style></head><body><header><div class="brand">SCORE<span style="color:var(--lime)">-X</span></div><a href="./index.html">← Home</a></header><main><h1>Live Scores</h1><p class="muted">Live updates · Public scoreboard</p><div id="matches"><div class="empty">Connecting to live scores…</div></div><p class="refresh" id="connection">Connecting to Firebase…</p></main><script type="module">
import { db } from './firebase.js';
import { collection, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const root=document.querySelector('#matches'),connection=document.querySelector('#connection');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
onSnapshot(query(collection(db,'matches'),orderBy('updatedAt','desc')),snap=>{
 const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.status!=='deleted');
 if(!docs.length){root.innerHTML='<div class="empty">No matches available yet.<br>Check back when a scorer publishes a match.</div>';}
 else root.innerHTML=docs.map(m=>{const innings=m.innings||1;const total=m.score??0,wickets=m.wickets??0,balls=m.balls??0,overs=m.overs??20,overText=Math.floor(balls/6)+'.'+(balls%6);return '<article class="match"><div class="tag">'+(m.status==='live'?'● LIVE':esc((m.status||'UPCOMING').toUpperCase()))+' · '+esc(m.tournament||'Cricket Match')+'</div><div class="teams"><div class="team"><div>'+esc(m.teamA||'Team 1')+'</div><div class="score">'+(m.innings===1||m.innings===2?esc(m.teamAScore??(innings===1?total:'—')):esc(m.teamAScore??'—'))+'</div><div class="overs">'+(m.innings===1?'('+overText+' overs)':'')+'</div></div><div class="vs">VS</div><div class="team"><div>'+esc(m.teamB||'Team 2')+'</div><div class="score">'+esc(m.teamBScore??'—')+'</div><div class="overs">'+esc(m.overs??20)+' overs match</div></div></div>'+(m.strikerName||m.nonStrikerName||m.bowlerName?'<div class="players"><div>Batting: <b>'+esc(m.strikerName||'—')+'</b> * · '+esc(m.nonStrikerName||'—')+'</div><div style="margin-top:5px">Bowling: <b>'+esc(m.bowlerName||'—')+'</b></div></div>':'')+'<div class="status">'+esc(m.statusText||((m.status==='live'?'In progress':m.status==='completed'?'Match completed':'Match not started')+' · '+(m.score??0)+'/'+(m.wickets??0)+' ('+overText+' overs)'))+'</div></article>';}).join('');
 connection.textContent='Connected · Last synced '+new Date().toLocaleTimeString();
},err=>{root.innerHTML='<div class="empty">Could not load live scores. Check Firestore setup and security rules.</div>';connection.textContent='Firebase error: '+err.message;});
</script></body></html>
