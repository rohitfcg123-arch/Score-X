<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live Scores | Score-X</title><style>
:root{color-scheme:dark;--bg:#071b16;--panel:#102a23;--line:#29473d;--lime:#c6f36b;--muted:#a6bbb1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f8f4;font:16px system-ui,Arial}header,main{max-width:900px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line)}a{color:var(--lime);text-decoration:none}.brand{font-size:22px;font-weight:900}.muted{color:var(--muted)}.match{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;margin:16px 0}.tag{color:var(--lime);font-size:12px;font-weight:800;letter-spacing:1px}.teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin:22px 0}.team:last-child{text-align:right}.score{font-size:clamp(27px,5vw,42px);font-weight:900;letter-spacing:-1px}.overs{color:var(--muted);font-size:14px}.vs{color:var(--muted)}.status{border-top:1px solid var(--line);padding-top:14px;color:var(--muted)}.players{margin:12px 0;padding:12px;border-radius:10px;background:#0a211a;color:#d7e8dc;font-size:14px}.players b{color:#c6f36b}.empty{border:1px dashed var(--line);border-radius:16px;padding:28px;text-align:center;color:var(--muted)}.refresh{font-size:12px;color:var(--muted)}.detailsToggle,.detailTab{border:1px solid var(--line);background:#17382d;color:#f3f8f4;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}.detailsToggle{width:100%;margin-top:14px;color:var(--lime)}.detailTabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.detailTab.active{background:var(--lime);color:#071b16}.matchDetails{display:none;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}.matchDetails.open{display:block}.detailTable{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}.detailTable th,.detailTable td{padding:9px 7px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.detailTable th:first-child,.detailTable td:first-child{text-align:left}.overCard{background:#0a211a;border:1px solid var(--line);border-radius:12px;padding:12px;margin:9px 0}.overBalls{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}.overBall{border-radius:50px;background:#24483b;padding:7px 10px;font-size:13px}.overBall.wicket{background:#7d2929}.detailGraph{width:100%;height:auto}.livePulse{display:inline-block;width:9px;height:9px;border-radius:50%;background:#ff5555;margin-right:7px;animation:livePulse 1.1s infinite}@keyframes livePulse{0%,100%{opacity:1;box-shadow:0 0 0 0 #ff555566}50%{opacity:.45;box-shadow:0 0 0 7px #ff555500}}.liveTicker{overflow:hidden;background:#17382d;border:1px solid var(--line);border-radius:10px;padding:9px;margin:12px 0;color:var(--lime);font-size:13px;font-weight:700}.liveTicker span{display:inline-block;white-space:nowrap;animation:tickerMove 16s linear infinite}@keyframes tickerMove{0%{transform:translateX(100%)}100%{transform:translateX(-100%)}}.livePlayers{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:12px 0}.livePlayer{background:#0a211a;border:1px solid var(--line);border-radius:12px;padding:11px;font-size:13px}.livePlayer.striker{border-color:var(--lime)}.livePlayer strong{display:block;color:#c6f36b;font-size:15px;margin-bottom:5px}.livePlayer small{color:var(--muted)}.viewerNotice{margin:12px 0;padding:12px;border:1px solid #8b7134;background:#302a18;border-radius:12px;color:#ffe39a}.viewerNotice strong{display:block;margin-bottom:4px}.breakTag{display:inline-block;border-radius:20px;background:#8b7134;color:#fff1bd;padding:3px 9px;font-size:11px;margin-left:7px}@media(max-width:430px){.livePlayers{grid-template-columns:1fr}}</style></head><body><header><div class="brand">SCORE<span style="color:var(--lime)">-X</span></div><a href="./index.html">← Home</a></header><main><h1>Live Scores</h1><p class="muted">Live updates · Public scoreboard</p><button id="soundToggle" class="detailsToggle" type="button" aria-pressed="false">🔇 Sound OFF · Tap to enable</button><p class="refresh" id="soundStatus">Enable sound to hear sixes during live matches.</p><div id="matches"><div class="empty">Connecting to live scores…</div></div><p class="refresh" id="connection">Connecting to Firebase…</p></main><script type="module">
import { db } from './firebase.js';
import { collection, onSnapshot, query, orderBy } from 'https://www.gstatic.com/firebasejs/11.6.0/firebase-firestore.js';
const root=document.querySelector('#matches'),connection=document.querySelector('#connection');
const sixAudio=new Audio('./assets/sounds/six-1.mp3');sixAudio.preload='auto';let soundEnabled=false;const previousBallCounts=new Map();let firstSnapshot=true;
const soundToggle=document.querySelector('#soundToggle'),soundStatus=document.querySelector('#soundStatus');
soundToggle.addEventListener('click',async()=>{soundEnabled=!soundEnabled;soundToggle.textContent=soundEnabled?'🔊 Sound ON · Tap to mute':'🔇 Sound OFF · Tap to enable';soundToggle.setAttribute('aria-pressed',String(soundEnabled));soundStatus.textContent=soundEnabled?'Six sound enabled. A sound will play when a six is scored.':'Sound muted.';if(soundEnabled){try{sixAudio.muted=true;await sixAudio.play();sixAudio.pause();sixAudio.currentTime=0;sixAudio.muted=false;}catch(e){soundEnabled=false;sixAudio.muted=false;soundToggle.textContent='🔇 Sound OFF · Tap to enable';soundToggle.setAttribute('aria-pressed','false');soundStatus.textContent='Tap again to allow sound in your browser.';}}});
function playSixSound(){if(!soundEnabled)return;sixAudio.pause();sixAudio.currentTime=0;sixAudio.play().catch(()=>{soundStatus.textContent='Tap Sound ON again to allow playback.';});}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const matchCache=new Map();
function renderDetails(m,tab){
 const bat=m.battingStats||{},bowl=m.bowlerStats||{},events=Array.isArray(m.ballHistory)?m.ballHistory:[];
 const table=(heads,rows)=>'<div style="overflow-x:auto"><table class="detailTable"><thead><tr>'+heads.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+(rows||'<tr><td colspan="'+heads.length+'">No data yet</td></tr>')+'</tbody></table></div>';
 if(tab==='scoreboard'){
  const br=Object.entries(bat).map(([n,v])=>'<tr><td>'+esc(n)+(n===m.strikerName?' *':'')+'</td><td>'+Number(v.runs||0)+'</td><td>'+Number(v.balls||0)+'</td><td>'+Number(v.fours||0)+'</td><td>'+Number(v.sixes||0)+'</td><td>'+(Number(v.runs||0)/Math.max(1,Number(v.balls||0))*100).toFixed(1)+'</td></tr>').join('');
  const wr=Object.entries(bowl).map(([n,v])=>'<tr><td>'+esc(n)+'</td><td>'+Math.floor(Number(v.balls||0)/6)+'.'+(Number(v.balls||0)%6)+'</td><td>'+Number(v.maidens||0)+'</td><td>'+Number(v.runs||0)+'</td><td>'+Number(v.wickets||0)+'</td><td>'+(Number(v.runs||0)/Math.max(1,Number(v.balls||0)/6)).toFixed(2)+'</td></tr>').join('');
  return '<h3>Batting Scorecard</h3>'+table(['Batter','R','B','4s','6s','SR'],br)+'<h3>Bowling Figures</h3>'+table(['Bowler','O','M','R','W','ER'],wr);
 }
 if(tab==='overs'){
  const groups={};events.forEach(e=>{const k=Number(e.innings||1)+'-'+Number(e.over||0);(groups[k]||(groups[k]={inn:Number(e.innings||1),over:Number(e.over||0),balls:[]})).balls.push(e)});
  return Object.values(groups).sort((a,b)=>a.inn-b.inn||a.over-b.over).map(g=>'<div class="overCard"><b>Innings '+g.inn+' · Over '+(g.over+1)+'</b><div class="overBalls">'+g.balls.map(e=>'<span class="overBall '+(e.wicket?'wicket':'')+'">'+esc(e.label??e.run??'0')+'</span>').join('')+'</div></div>').join('')||'<p class="muted">Ball-by-ball details will appear as the match is scored.</p>';
 }
 if(!events.length)return '<p class="muted">Graph will appear after the first delivery.</p>';
 const inns=[...new Set(events.map(e=>Number(e.innings||1)))].sort(),maxO=Math.max(1,Number(m.maxOvers||m.overs||20)),maxR=Math.max(5,...inns.map(i=>events.filter(e=>Number(e.innings||1)===i).reduce((a,e)=>a+Number(e.runsAdded??e.run??0),0))),palette=['#c6f36b','#63b3ed'];
 const lines=inns.map((inn,j)=>{let total=0;const arr=events.filter(e=>Number(e.innings||1)===inn).sort((a,b)=>Number(a.over||0)*6+Number(a.ball||0)-(Number(b.over||0)*6+Number(b.ball||0)));const pts=[[0,0]];arr.forEach(e=>{total+=Number(e.runsAdded??e.run??0);pts.push([Number(e.over||0)+Number(e.ball||0)/6,total])});return '<polyline fill="none" stroke="'+palette[j%2]+'" stroke-width="3" points="'+pts.map(p=>(38+p[0]/maxO*610)+','+(218-p[1]/maxR*180)).join(' ')+'"/>'}).join('');
 return '<svg class="detailGraph" viewBox="0 0 680 250"><line x1="38" y1="218" x2="650" y2="218" stroke="#789187"/><line x1="38" y1="25" x2="38" y2="218" stroke="#789187"/>'+[0,1,2,3,4].map(i=>'<line x1="38" y1="'+(218-i*45)+'" x2="650" y2="'+(218-i*45)+'" stroke="#29473d"/><text x="5" y="'+(222-i*45)+'" fill="#a6bbb1" font-size="10">'+Math.round(maxR*i/4)+'</text>').join('')+lines+'<text x="340" y="245" fill="#a6bbb1" font-size="11" text-anchor="middle">Overs</text></svg>';
}
function openMatchDetails(id,button){
 const box=document.getElementById('details-'+id),m=matchCache.get(id);
 if(!box||!m)return;
 const opening=!box.classList.contains('open');
 box.classList.toggle('open',opening);
 if(button)button.textContent=opening?'Hide Match Details':'View Match Details';
 if(opening){const panel=box.querySelector('.detailPanel');if(panel)panel.innerHTML=renderDetails(m,'scoreboard');}
}
function bindMatchDetailButtons(){
 root.querySelectorAll('[data-open-match]').forEach(button=>button.addEventListener('click',()=>openMatchDetails(button.dataset.openMatch,button)));
 root.querySelectorAll('[data-match-tab]').forEach(button=>button.addEventListener('click',()=>{
  const id=button.dataset.matchId,box=document.getElementById('details-'+id),m=matchCache.get(id);
  if(!box||!m)return;
  box.querySelectorAll('[data-match-tab]').forEach(tab=>tab.classList.toggle('active',tab===button));
  const panel=box.querySelector('.detailPanel');if(panel)panel.innerHTML=renderDetails(m,button.dataset.matchTab);
 }));
}
onSnapshot(query(collection(db,'matches'),orderBy('updatedAt','desc')),snap=>{
 const docs=snap.docs.map(d=>({id:d.id,...d.data()})).filter(m=>m.status!=='deleted');
 docs.forEach(m=>{const events=Array.isArray(m.ballHistory)?m.ballHistory:[],oldCount=previousBallCounts.get(m.id);if(!firstSnapshot&&oldCount!==undefined&&events.length>oldCount){const added=events.slice(oldCount);if(added.some(e=>Number(e.run)===6&&e.kind==='normal'&&!e.wicket))playSixSound();}previousBallCounts.set(m.id,events.length);});
 firstSnapshot=false;
 docs.forEach(m=>matchCache.set(m.id,m));
 if(!docs.length){root.innerHTML='<div class="empty">No matches available yet.<br>Check back when a scorer publishes a match.</div>';}
 else root.innerHTML=docs.map(m=>{const innings=m.innings||1;const total=m.score??0,wickets=m.wickets??0,balls=m.balls??0,overText=Math.floor(balls/6)+'.'+(balls%6),scoreA=m.teamAScore??(m.battingTeam?(m.battingTeam===m.teamA?total:'—'):(innings===1?total:'—')),scoreB=m.teamBScore??(m.battingTeam?(m.battingTeam===m.teamB?total:'—'):'—'),overA=m.battingTeam===m.teamA?'('+overText+' overs)':'',overB=m.battingTeam===m.teamB?'('+overText+' overs)':'';return '<article class="match"><div class="tag">'+(m.status==='live'?'<span class="livePulse"></span>LIVE NOW':esc((m.status||'UPCOMING').toUpperCase()))+' · '+esc(m.tournament||'Cricket Match')+'</div>'+(m.status==='live'?'<div class="liveTicker"><span>● LIVE MATCH IN PROGRESS · SCORE-X LIVE COVERAGE · '+esc(m.teamA||'Team 1')+' vs '+esc(m.teamB||'Team 2')+'</span></div>':'')+(m.viewerMessage?'<div class="viewerNotice"><strong>'+(m.viewerBreakType&&m.viewerBreakType!=='custom'?esc(m.viewerBreakType.toUpperCase()):'MATCH UPDATE')+(m.viewerBreakType&&m.viewerBreakType!=='none'?'<span class="breakTag">'+esc(m.viewerBreakType.toUpperCase())+'</span>':'')+'</strong>'+esc(m.viewerMessage)+'</div>':'')+'<div class="teams"><div class="team"><div>'+esc(m.teamA||'Team 1')+'</div><div class="score">'+(m.innings===1||m.innings===2?esc(scoreA):esc(m.teamAScore??'—'))+'</div><div class="overs">'+overA+'</div></div><div class="vs">VS</div><div class="team"><div>'+esc(m.teamB||'Team 2')+'</div><div class="score">'+esc(scoreB)+'</div><div class="overs">'+(overB||esc(m.overs??20)+' overs match')+'</div></div></div>'+(m.strikerName||m.nonStrikerName||m.bowlerName?(()=>{const bs=m.battingStats||{},ws=m.bowlerStats||{},st=bs[m.strikerName]||{},ns=bs[m.nonStrikerName]||{},bw=ws[m.bowlerName]||{};return '<div class="livePlayers"><div class="livePlayer striker"><strong>★ '+esc(m.strikerName||'—')+' <small>(STRIKER)</small></strong><b>'+Number(st.runs||0)+'* runs</b><br><small>'+Number(st.balls||0)+' balls · '+Number(st.fours||0)+' fours · '+Number(st.sixes||0)+' sixes</small></div><div class="livePlayer"><strong>'+esc(m.nonStrikerName||'—')+' <small>(NON-STRIKER)</small></strong><b>'+Number(ns.runs||0)+' runs</b><br><small>'+Number(ns.balls||0)+' balls · '+Number(ns.fours||0)+' fours · '+Number(ns.sixes||0)+' sixes</small></div></div><div class="players"><b>Bowler:</b> '+esc(m.bowlerName||'—')+' · '+Math.floor(Number(bw.balls||0)/6)+'.'+(Number(bw.balls||0)%6)+' overs · '+Number(bw.runs||0)+' runs · '+Number(bw.wickets||0)+' wickets</div>';})():'')+'<div class="status">'+esc(m.statusText||((m.status==='live'?'In progress':m.status==='completed'?'Match completed':'Match not started')+' · '+(m.score??0)+'/'+(m.wickets??0)+' ('+overText+' overs)'))+'</div><button class="detailsToggle" data-open-match="'+esc(m.id)+'">View Match Details</button><section class="matchDetails" id="details-'+esc(m.id)+'"><div class="detailTabs"><button class="detailTab active" data-match-id="'+esc(m.id)+'" data-match-tab="scoreboard">Scoreboard</button><button class="detailTab" data-match-id="'+esc(m.id)+'" data-match-tab="overs">Overs</button><button class="detailTab" data-match-id="'+esc(m.id)+'" data-match-tab="chart">Graph</button></div><div class="detailPanel"></div></section></article>';}).join('');
 bindMatchDetailButtons();
 connection.textContent='Connected · Last synced '+new Date().toLocaleTimeString();
},err=>{root.innerHTML='<div class="empty">Could not load live scores. Check Firestore setup and security rules.</div>';connection.textContent='Firebase error: '+err.message;});
</script></body></html>
